name: Latest YouTube Videos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: BLOG-POST-LIST
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCK14FxPR0eZFadp0e7B0M9A"
          max_post_count: 3
          title_max_length: 55

          item_exec: >-
            const m = post.url.match(/(?:v=|shorts\/)([A-Za-z0-9_-]{11})/);
            if (m) {
              post.imageLink = 'https://img.youtube.com/vi/' + m[1] + '/hqdefault.jpg';
            }

          template: >-
            <td align="center" width="33%">
            <a href="$url">
            <img src="$imageLink" width="260">
            <br>
            <sub><b>$title</b></sub>
            </a>
            </td>
